# goldata-web: serves the React build and proxies /api, /mcp and /health to the API container (002-spec §9.4).
# TLS terminates at the DSM reverse proxy, which forwards to 127.0.0.1:8085 → this container.

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Requests arrive from the DSM reverse proxy via the Docker gateway: trust its X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;   # Docker networks (subnet differs per environment: prod/uat)
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 85m;   # 80 MB uploads + multipart overhead

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 300s;
        proxy_request_buffering off;   # stream uploads to the API
    }

    location /mcp {
        proxy_pass http://api:8080;
        proxy_buffering off;           # Streamable HTTP / SSE
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
